<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Centro de Simulación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0f1c;
    --surface:#121a2b;
    --surface-2:#17223a;
    --line:rgba(255,255,255,.07);
    --ink:#edf1f7;
    --muted:#7e8ba3;
    --ok:#2dd4bf;
    --ok-dim:rgba(45,212,191,.14);
    --busy:#fb7185;
    --busy-dim:rgba(251,113,133,.16);
    --accent:#5b8def;

    --libre-1:#0d9488;
    --libre-2:#10b981;
    --ocupada-1:#9f1239;
    --ocupada-2:#e11d48;
    --debrief-1:#b45309;
    --debrief-2:#f59e0b;
    --radius:20px;
    --font-display:'Space Grotesk',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    position:relative;
    background:
      radial-gradient(1100px 620px at 8% -10%, rgba(91,141,239,.10), transparent 55%),
      radial-gradient(900px 700px at 105% 10%, rgba(45,212,191,.06), transparent 60%),
      radial-gradient(800px 560px at 20% 115%, rgba(180,83,9,.05), transparent 60%),
      radial-gradient(700px 500px at 90% 100%, rgba(91,141,239,.05), transparent 60%),
      var(--bg);
    background-attachment:fixed;
  }
  body.cursor-hidden{cursor:none;}
  body.december-mode{
    background:
      radial-gradient(1000px 600px at 8% -10%, rgba(92,184,92,.22), transparent 58%),
      radial-gradient(900px 700px at 105% 10%, rgba(34,139,70,.24), transparent 62%),
      linear-gradient(145deg, #063b25 0%, #0b5a32 52%, #07351f 100%);
  }
  body.patria-mode{
    background:
      linear-gradient(rgba(4,28,24,.28), rgba(4,28,24,.28)),
      url('fechas_patrias/fondo.webp') center / cover fixed no-repeat;
  }
  body.women-day-mode{
    background:
      radial-gradient(900px 560px at 8% -10%, rgba(255,255,255,.42), transparent 62%),
      radial-gradient(800px 620px at 105% 15%, rgba(255,128,177,.62), transparent 64%),
      linear-gradient(145deg, #ed82ad 0%, #f4a8c5 52%, #e8669b 100%);
  }
  body.september-twenty-first-mode{
    background:
      radial-gradient(900px 620px at 12% -10%, rgba(255,233,146,.34), transparent 62%),
      radial-gradient(780px 560px at 105% 15%, rgba(38,130,95,.38), transparent 62%),
      linear-gradient(145deg, #1c7f5c 0%, #2e8d6c 38%, #0d3f2f 100%);
  }

  .snow-layer{
    position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;display:none;
  }
  body.december-mode .snow-layer{display:block;}
  .snowflake{
    position:absolute;top:-10vh;left:var(--snow-left);width:var(--snow-size);height:var(--snow-size);
    border-radius:50%;background:rgba(255,255,255,.9);
    box-shadow:0 0 5px rgba(255,255,255,.7);
    opacity:var(--snow-opacity);
    animation:snowFall var(--snow-duration) linear var(--snow-delay) infinite;
  }
  .santa-sleigh{
    position:fixed;
    z-index:4;
    width:clamp(150px, 18vw, 300px);
    max-width:42vw;
    aspect-ratio:516 / 120;
    height:auto;
    pointer-events:none;
    display:none;
    opacity:0;
    transform:translate(-50%, -50%);
    filter:drop-shadow(0 8px 8px rgba(0,20,12,.34));
    will-change:left, top, transform;
  }
  body.december-mode .santa-sleigh{
    display:block;
    opacity:.96;
  }
  .santa-sleigh-image{display:block;width:100%;height:100%;object-fit:contain;}
  .sleigh-sparks{
    position:fixed;inset:0;z-index:3;
    pointer-events:none;overflow:hidden;display:none;
  }
  body.december-mode .sleigh-sparks{display:block;}
  .sleigh-spark{
    position:absolute;left:var(--spark-left);top:var(--spark-top);
    width:var(--spark-width);height:var(--spark-height);
    border-radius:999px;
    background:linear-gradient(#fffbd1,#ffd34e 45%,rgba(255,117,24,0));
    box-shadow:0 0 7px #ffd34e, 0 0 12px rgba(255,125,24,.75);
    opacity:0;
    transform-origin:top center;
    animation:sparkFall var(--spark-duration) ease-in 0s forwards;
  }

  .butterfly-layer{
    position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden;display:none;
  }
  body.september-twenty-first-mode .butterfly-layer{display:block;}
  .butterfly{
    position:absolute;
    left:var(--butterfly-left, 0px);
    top:var(--butterfly-top, 0px);
    width:var(--butterfly-size, 54px);
    height:var(--butterfly-size, 54px);
    opacity:0;
    filter:drop-shadow(0 8px 16px rgba(0,0,0,.15));
    animation:butterflyFlight var(--butterfly-duration, 18s) ease-in-out infinite alternate;
    transform-origin:center;
  }
  @keyframes butterflyFlight{
    0%{
      transform:translate3d(0, 0, 0) rotate(-18deg) scale(.8);
      opacity:0;
    }
    12%{opacity:1;}
    35%{
      transform:translate3d(calc(var(--butterfly-dx, 0px) * .25), calc(var(--butterfly-dy, 0px) * .25), 0) rotate(18deg) scale(1);
      opacity:1;
    }
    65%{
      transform:translate3d(calc(var(--butterfly-dx, 0px) * .65), calc(var(--butterfly-dy, 0px) * .8), 0) rotate(-26deg) scale(.96);
      opacity:1;
    }
    100%{
      transform:translate3d(var(--butterfly-dx, 0px), var(--butterfly-dy, 0px), 0) rotate(22deg) scale(.86);
      opacity:0;
    }
  }
  @keyframes sparkFall{
    0%{transform:translate3d(0,0,0) scale(.6) rotate(var(--spark-angle));opacity:1;}
    18%{opacity:1;}
    100%{transform:translate3d(var(--spark-drift),var(--spark-distance),0) scale(.15) rotate(var(--spark-angle));opacity:0;}
  }
  @keyframes snowFall{
    0%{transform:translate3d(0,-12vh,0);}
    50%{transform:translate3d(var(--snow-drift),50vh,0);}
    100%{transform:translate3d(calc(var(--snow-drift) * -1),112vh,0);}
  }

  /* Sutil textura de puntos + líneas en el fondo */
  body::before{
    content:"";
    position:fixed;inset:0;
    z-index:0;pointer-events:none;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 0);
    background-size:36px 36px;
    -webkit-mask-image:radial-gradient(1400px 900px at 50% 0%, #000 0%, transparent 78%);
    mask-image:radial-gradient(1400px 900px at 50% 0%, #000 0%, transparent 78%);
    opacity:.6;
  }
  body::after{
    content:"";
    position:fixed;inset:0;
    z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:120px 120px;
    -webkit-mask-image:radial-gradient(1200px 800px at 50% 10%, #000 0%, transparent 70%);
    mask-image:radial-gradient(1200px 800px at 50% 10%, #000 0%, transparent 70%);
  }

  .wrap{max-width:1920px;margin:0 auto;padding:36px 48px 44px;position:relative;z-index:1;}

  /* ---------- Header ---------- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:22px;margin-bottom:26px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;gap:16px;align-items:center}
  .mode-toggle{
    width:48px;height:48px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(155deg,var(--surface-2),var(--surface));
    border:1px solid var(--line);
    color:var(--accent);
    flex-shrink:0;
    padding:0;
    cursor:pointer;
    appearance:none;
    font:inherit;
  }
  .mode-toggle:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
  }
  .brand-text h1{
    font-family:var(--font-display);
    font-size:26px;font-weight:600;letter-spacing:.2px;margin:0;color:var(--ink);
  }
  .brand-text h1 .developer-mode-indicator{
    display:none;
    margin-left:12px;
    color:#ff4d67;
    font-family:var(--font-mono);
    font-size:12px;
    font-weight:600;
    letter-spacing:.1em;
    text-transform:uppercase;
    animation:developerModeBlink 1s ease-in-out infinite;
  }
  .brand-text h1 .developer-mode-indicator.visible{display:inline-block;}
  @keyframes developerModeBlink{
    0%,100%{opacity:1;}
    50%{opacity:.25;}
  }
  .developer-tools{
    display:none;
    flex-wrap:wrap;
    margin-top:20px;
    padding:16px 18px;
    border:1px solid rgba(255,77,103,.35);
    border-radius:var(--radius);
    background:rgba(38,15,25,.72);
  }
  body.developer-mode .developer-tools{display:flex;align-items:center;gap:16px;}
  .developer-tools-label{
    color:rgba(255,255,255,.78);
    font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  }
  .december-toggle{
    border:1px solid rgba(255,255,255,.32);
    border-radius:10px;
    padding:9px 14px;
    background:rgba(255,255,255,.1);
    color:#fff;
    font:600 13px var(--font-body);
    cursor:pointer;
  }
  .december-toggle:hover{background:rgba(255,255,255,.18);}
  .december-toggle[aria-pressed="true"]{background:#0b7542;border-color:#72e2a7;}
  .patria-events{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    flex-basis:100%;
  }
  .patria-event-toggle{
    border:1px solid rgba(255,255,255,.26);
    border-radius:8px;
    padding:8px 11px;
    background:rgba(255,255,255,.08);
    color:rgba(255,255,255,.9);
    font:500 12px var(--font-body);
    cursor:pointer;
  }
  .patria-event-toggle:hover{background:rgba(255,255,255,.16);}
  .patria-event-toggle[aria-pressed="true"]{background:#145c62;border-color:#8be0df;color:#fff;}
  .brand-text span{
    display:block;font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin-top:3px;
  }

  .sound-toggle{
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    margin-left:auto;margin-right:24px;
    padding:0;
    border:1px solid var(--line);
    border-radius:10px;
    background:rgba(255,255,255,.04);
    color:var(--muted);
    cursor:pointer;
    appearance:none;
  }
  .sound-toggle:hover{background:rgba(255,255,255,.09);color:var(--ink);}
  .sound-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .sound-toggle[aria-pressed="true"]{color:var(--ok);border-color:rgba(45,212,191,.45);}
  .sound-toggle.sound-error{color:#ff4d67;border-color:rgba(255,77,103,.65);}
  .sound-toggle.playing svg{animation:soundIconBlink 1s ease-in-out infinite;}
  @keyframes soundIconBlink{
    0%,100%{opacity:1;}
    50%{opacity:.22;}
  }
  .sound-toggle svg{width:17px;height:17px;}

  .clock{text-align:right;line-height:1.15;}
  .clock .time{
    font-family:var(--font-mono);font-weight:500;font-size:30px;color:var(--ink);
    letter-spacing:.03em;font-variant-numeric:tabular-nums;
  }
  .clock .date{
    font-family:var(--font-mono);font-size:13px;color:var(--muted);
    letter-spacing:.08em;text-transform:uppercase;margin-top:2px;
  }

  /* ---------- Grid ---------- */
  .grid{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    grid-template-rows:repeat(2,minmax(0,1fr));gap:20px;
  }

  .card{
    position:relative;
    background:linear-gradient(150deg, var(--grad-1, var(--libre-1)) 0%, var(--grad-2, var(--libre-2)) 100%);
    border:1px solid rgba(255,255,255,.12);
    border-radius:var(--radius);
    padding:24px 26px 22px;
    min-height:200px;
    display:flex;flex-direction:column;justify-content:flex-start;
    overflow:hidden;cursor:pointer;
    isolation:isolate;
    box-shadow:
      0 14px 30px -8px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,255,255,.28),
      inset 0 0 60px rgba(255,255,255,.05);
    transition:transform .2s ease, box-shadow .2s ease, filter .2s ease;
  }
  body.has-patria-background .card.free-card{
    background:linear-gradient(150deg, rgba(13,148,136,.5) 0%, rgba(16,185,129,.5) 100%);
  }
  .card-snow-cap{
    position:absolute;
    top:-1px;left:4px;right:4px;height:15px;
    z-index:2;
    pointer-events:none;
    display:none;
    background:
      radial-gradient(18px 8px at 7% 100%, #fff 0 72%, transparent 74%),
      radial-gradient(24px 9px at 23% 100%, #f8fcff 0 72%, transparent 74%),
      radial-gradient(20px 8px at 42% 100%, #fff 0 72%, transparent 74%),
      radial-gradient(28px 10px at 63% 100%, #f8fcff 0 72%, transparent 74%),
      radial-gradient(18px 8px at 82% 100%, #fff 0 72%, transparent 74%),
      linear-gradient(#fff 0 58%, #e8f4fb 100%);
    border-radius:12px 12px 46% 42%;
    box-shadow:0 3px 5px rgba(211,231,241,.7), 0 5px 9px rgba(0,20,35,.22);
    filter:drop-shadow(0 1px 1px rgba(255,255,255,.75));
  }
  body.december-mode .card-snow-cap{display:block;}
  .card::before{
    content:"";position:absolute;inset:0;z-index:-1;
    background:radial-gradient(120% 90% at 8% -10%, rgba(255,255,255,.20), transparent 55%);
  }
  .card::after{
    content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background:linear-gradient(120deg,
      rgba(255,255,255,.30) 0%,
      rgba(255,255,255,0) 16%,
      rgba(255,255,255,0) 58%,
      rgba(255,255,255,.16) 72%,
      rgba(255,255,255,0) 88%);
    mix-blend-mode:soft-light;
    transition:opacity .3s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:
      0 20px 40px -8px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.32),
      inset 0 0 60px rgba(255,255,255,.07);
    filter:brightness(1.04);
  }
  .card:focus{
    outline:none;
  }
  body.keyboard-navigation .card:focus{
    outline:2px solid #fff;
    outline-offset:3px;
  }

  /* Barrido de luz sutil y periódico */
  .card-sheen{
    position:absolute;inset:0;z-index:0;pointer-events:none;
    overflow:hidden;
    border-radius:inherit;
  }
  .card-sheen::before{
    content:"";position:absolute;top:-40%;bottom:-40%;left:-60%;width:35%;
    background:linear-gradient(75deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,.22) 45%,
      rgba(255,255,255,.32) 50%,
      rgba(255,255,255,.22) 55%,
      rgba(255,255,255,0) 100%);
    transform:skewX(-18deg);
    animation:cardSheenSweep 40s ease-in-out infinite;
    mix-blend-mode:screen;
  }
  .card:nth-child(2) .card-sheen::before{animation-delay:5s;}
  .card:nth-child(3) .card-sheen::before{animation-delay:10s;}
  .card:nth-child(4) .card-sheen::before{animation-delay:15s;}
  .card:nth-child(5) .card-sheen::before{animation-delay:20s;}
  .card:nth-child(6) .card-sheen::before{animation-delay:25s;}
  .card:nth-child(7) .card-sheen::before{animation-delay:30s;}
  .card:nth-child(8) .card-sheen::before{animation-delay:35s;}
  @keyframes cardSheenSweep{
    0%,12%{left:-60%;}
    38%,100%{left:130%;}
  }

  .card-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
  .eyebrow{
    display:flex;align-items:center;gap:8px;
    padding:5px 10px 5px 6px;border-radius:999px;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.22);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    font-family:var(--font-mono);font-size:11.5px;letter-spacing:.12em;
    text-transform:uppercase;color:rgba(255,255,255,.85);
  }
  .eyebrow .code{
    color:#fff;opacity:.85;
    background:rgba(255,255,255,.18);
    border-radius:999px;padding:2px 7px;
  }
  .led{
    width:8px;height:8px;border-radius:50%;
    background:#fff;
    box-shadow:0 0 0 4px rgba(255,255,255,.28);
  }
  .led.pulse{animation:ledPulse 1.8s ease-in-out infinite;}
  @keyframes ledPulse{
    0%,100%{box-shadow:0 0 0 4px rgba(255,255,255,.35);}
    50%{box-shadow:0 0 0 9px rgba(255,255,255,.10);}
  }

  .name{
    font-family:var(--font-display);
    font-size:60px;font-weight:600;line-height:1.12;
    letter-spacing:.1px;margin:14px 0 0 0;color:#fff;
    align-self:flex-start;
    text-align:left;
    position:relative;z-index:1;
    -webkit-text-stroke:1px rgba(0,0,0,.55);
    paint-order:stroke fill;
    text-shadow:
      -1.5px -1.5px 0 rgba(0,0,0,.45),
       1.5px -1.5px 0 rgba(0,0,0,.45),
      -1.5px  1.5px 0 rgba(0,0,0,.45),
       1.5px  1.5px 0 rgba(0,0,0,.45),
       0 2px 10px rgba(0,0,0,.25);
  }

  .name.beat{
    animation:nameShadowBeat 3.2s ease-in-out infinite;
  }
  @keyframes nameShadowBeat{
    0%,18%,100%{
      text-shadow:
        -1.5px -1.5px 0 rgba(0,0,0,.45),
         1.5px -1.5px 0 rgba(0,0,0,.45),
        -1.5px  1.5px 0 rgba(0,0,0,.45),
         1.5px  1.5px 0 rgba(0,0,0,.45),
         0 0 10px rgba(0,0,0,.25);
    }
    9%{
      text-shadow:
        -1.5px -1.5px 0 rgba(0,0,0,.45),
         1.5px -1.5px 0 rgba(0,0,0,.45),
        -1.5px  1.5px 0 rgba(0,0,0,.45),
         1.5px  1.5px 0 rgba(0,0,0,.45),
         0 0 28px rgba(0,0,0,.55);
    }
    27%{
      text-shadow:
        -1.5px -1.5px 0 rgba(0,0,0,.45),
         1.5px -1.5px 0 rgba(0,0,0,.45),
        -1.5px  1.5px 0 rgba(0,0,0,.45),
         1.5px  1.5px 0 rgba(0,0,0,.45),
         0 0 28px rgba(0,0,0,.55);
    }
    36%{
      text-shadow:
        -1.5px -1.5px 0 rgba(0,0,0,.45),
         1.5px -1.5px 0 rgba(0,0,0,.45),
        -1.5px  1.5px 0 rgba(0,0,0,.45),
         1.5px  1.5px 0 rgba(0,0,0,.45),
         0 0 10px rgba(0,0,0,.25);
    }
  }
  .pill{
    display:inline-flex;align-items:center;gap:8px;
    padding:7px 14px;border-radius:999px;
    font-family:var(--font-mono);font-weight:500;font-size:12.5px;
    letter-spacing:.04em;
    color:#fff;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.32);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .pill svg{width:9px;height:9px;flex-shrink:0;color:#fff;}

  .foot{margin-top:auto;position:relative;z-index:1;}

  /* ---------- Alert banner ---------- */
  .alert-wrapper{
    display:none;align-items:stretch;gap:22px;
    margin:30px 0 4px;
    width:100%;
  }
  .alert-wrapper.mode-active{
    display:flex;
    width:100%;
    max-width:100%;
    margin-left:0;
    margin-right:0;
  }
  .alert-card{
    flex:0 0 1200px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:center;
    gap:8px;
    min-height:325px;
    margin:0;
    padding:34px 40px;
    border-radius:var(--radius);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 16px 40px rgba(185,28,58,.28);
    position:relative;
    overflow:hidden;
  }
  .alert-card::before,
  .alert-card::after{
    content:"";position:absolute;inset:0;z-index:0;
  }
  .alert-card::before{
    background:#ff0014;
    animation:alertFadeRed 60s ease-in-out infinite;
  }
  .alert-card::after{
    background:#ffdd00;
    opacity:0;
    animation:alertFadeAmber 60s ease-in-out infinite;
  }
  @keyframes alertFadeRed{
    0%{opacity:1;} 50%{opacity:0;} 100%{opacity:1;}
  }
  @keyframes alertFadeAmber{
    0%{opacity:0;} 50%{opacity:1;} 100%{opacity:0;}
  }
  .alert-card > *{position:relative;z-index:1;}
  .alert-tag{
    font-family:var(--font-mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
    color:rgba(255,255,255,.8);
  }
  .alert-card strong{
    font-family:var(--font-display);font-size:152px;font-weight:700;color:#fff;letter-spacing:.2px;
    line-height:1.05;

<script>
const BUSY_STATES = new Set(['ocupada', 'debrief']);
const ROOM_ORDER = [
  'Sala de Parto',
  'Neonatología',
  'Terapia Intensiva',
  'Quirófano',
  'Consultorio Adulto',
  'Consultorio Pediatría',
  'Sala de Debriefing A',
  'Sala de Debriefing B'
];

const ROOM_DEFINITIONS = ROOM_ORDER.map((name) => ({
  name,
  type: name.includes('Debriefing') ? 'debrief' : 'room',
  state: 'libre'
}));

const grid = document.getElementById('grid');
const alertWrapper = document.getElementById('alertWrapper');
const modeToggle = document.querySelector('.mode-toggle');
const soundToggle = document.getElementById('soundToggle');
const developerModeIndicator = document.getElementById('developerModeIndicator');
const decemberToggle = document.getElementById('decemberToggle');
const patriaEventToggles = [...document.querySelectorAll('.patria-event-toggle')];
const snowLayer = document.getElementById('snowLayer');
const butterflyLayer = document.getElementById('butterflyLayer');
const santaSleigh = document.getElementById('santaSleigh');
const sleighSparks = document.getElementById('sleighSparks');
const alertImage = document.querySelector('.alert-image');
const alertCaption = document.querySelector('.alert-caption');
const timeText = document.getElementById('timeText');
const dateText = document.getElementById('dateText');
const silenceAudio = new Audio(new URL('./sonido_hospital.mp3', document.baseURI).href);
silenceAudio.preload = 'auto';
silenceAudio.loop = true;

const MODE_IMAGE_DIR = 'extra/';
const MODE_MANIFEST_PATH = `${MODE_IMAGE_DIR}manifest.json`;
const MODE_IMAGE_PAUSE = 10000;
const WOMEN_DAY_DIR = 'fechas_patrias/8%20de%20marzo/';
const WOMEN_DAY_MANIFEST_PATH = `${WOMEN_DAY_DIR}manifest.json`;
const PATRIA_EVENTS = [
  { day: 8, month: 2, label: '8 de marzo' },
  { day: 24, month: 2, label: '24 de marzo' },
  { day: 2, month: 3, label: '2 de abril' },
  { day: 1, month: 4, label: '1 de mayo' },
  { day: 25, month: 4, label: '25 de mayo' },
  { day: 17, month: 5, label: '17 de junio' },
  { day: 20, month: 5, label: '20 de junio' },
  { day: 9, month: 6, label: '9 de julio' },
  { day: 17, month: 7, label: '17 de agosto' },
  { day: 11, month: 8, label: '11 de septiembre' },
  { day: 21, month: 8, label: '21 de septiembre' },
  { day: 12, month: 9, label: '12 de octubre' },
  { day: 30, month: 9, label: '30 de octubre' },
  { day: 20, month: 10, label: '20 de noviembre' }
];

let roomsData = ROOM_DEFINITIONS.map((room) => ({ ...room }));
let modeActive = true;
let modeAssets = [];
let modeImageIndex = 0;
let modeImageTimer = null;
let womenDayAssets = [];
let womenDayImageIndex = 0;
let womenDayImageTimer = null;
let butterflyTimer = null;
let decemberMode = false;
let patriaMode = false;
let womenDayMode = false;
let selectedPatriaEvent = null;
let soundEnabled = false;
let alertWasActive = false;
let sleighAnimationFrame = null;
let sleighLastFrame = 0;
let sleighX = 0;
let sleighY = 0;
let sleighTargetY = 0;
let sleighDirection = 1;
let sleighInitialized = false;
let sleighSparkTimer = null;

function isDecember(date) {
  return date.getMonth() === 11 && date.getDate() >= 1 && date.getDate() <= 31;
}

function createSnowflakes() {
  if (!snowLayer || snowLayer.childElementCount > 0) return;
  for (let index = 0; index < 42; index += 1) {
    const flake = document.createElement('span');
    flake.className = 'snowflake';
    flake.style.setProperty('--snow-left', `${Math.random() * 100}%`);
    flake.style.setProperty('--snow-size', `${2 + Math.random() * 5}px`);
    flake.style.setProperty('--snow-opacity', `${0.45 + Math.random() * 0.5}`);
    flake.style.setProperty('--snow-duration', `${9 + Math.random() * 12}s`);
    flake.style.setProperty('--snow-delay', `${Math.random() * -18}s`);
    flake.style.setProperty('--snow-drift', `${-45 + Math.random() * 90}px`);
    snowLayer.appendChild(flake);
  }
}

function createSleighSparks() {
  if (!sleighSparks || sleighSparks.childElementCount > 0) return;
  for (let index = 0; index < 60; index += 1) {
    const spark = document.createElement('span');
    spark.className = 'sleigh-spark';
    sleighSparks.appendChild(spark);
  }
}

function createButterfly() {
  if (!butterflyLayer) return null;
  const butterfly = document.createElement('img');
  butterfly.className = 'butterfly';
  butterfly.src = Math.random() > 0.5 ? 'fechas_patrias/mariposa01.gif' : 'fechas_patrias/mariposa02.gif';
  const size = 44 + Math.random() * 52;
  const left = Math.random() * 90;
  const top = Math.random() * 70;
  const dx = (Math.random() * 700) - 350;
  const dy = (Math.random() * 320) - 150;

  butterfly.style.setProperty('--butterfly-left', `${left}%`);
  butterfly.style.setProperty('--butterfly-top', `${top}%`);
  butterfly.style.setProperty('--butterfly-size', `${size}px`);
  butterfly.style.setProperty('--butterfly-dx', `${dx}px`);
  butterfly.style.setProperty('--butterfly-dy', `${dy}px`);
  butterfly.style.setProperty('--butterfly-duration', `${12 + Math.random() * 12}s`);
  butterfly.style.transform = 'translate3d(0,0,0)';
  butterflyLayer.appendChild(butterfly);
  return butterfly;
}

function startSeptemberButterflies() {
  if (!butterflyLayer || !patriaMode || selectedPatriaEvent?.label !== '21 de septiembre') return;
  clearInterval(butterflyTimer);
  butterflyLayer.innerHTML = '';
  const count = 8;
  for (let index = 0; index < count; index += 1) {
    createButterfly();
  }
  butterflyTimer = setInterval(() => {
    if (!patriaMode || selectedPatriaEvent?.label !== '21 de septiembre') return;
    if (butterflyLayer.children.length < 10) {
      createButterfly();
    }
    if (Math.random() > 0.5) {
      const butterfly = butterflyLayer.children[Math.floor(Math.random() * butterflyLayer.children.length)];
      if (butterfly) {
        butterfly.style.animation = 'none';
        void butterfly.offsetWidth;
        butterfly.style.animation = `butterflyFlight ${12 + Math.random() * 12}s ease-in-out infinite alternate`;
      }
    }
  }, 1500);
}

function stopSeptemberButterflies() {
  clearInterval(butterflyTimer);
  butterflyTimer = null;
  if (butterflyLayer) butterflyLayer.innerHTML = '';
}

function emitSleighSpark() {
  if (!santaSleigh || !sleighSparks || !decemberMode) return;
  const sleighRect = santaSleigh.getBoundingClientRect();
  const spark = sleighSparks.children[Math.floor(Math.random() * sleighSparks.children.length)];
  if (!spark) return;
  const originX = sleighRect.left + sleighRect.width * (.2 + Math.random() * .6);
  const originY = sleighRect.bottom - 12;
  spark.style.setProperty('--spark-left', `${originX}px`);
  spark.style.setProperty('--spark-top', `${originY}px`);
  spark.style.setProperty('--spark-width', `${1.5 + Math.random() * 2.5}px`);
  spark.style.setProperty('--spark-height', `${5 + Math.random() * 9}px`);
  spark.style.setProperty('--spark-duration', `${.9 + Math.random() * 1.1}s`);
  spark.style.setProperty('--spark-drift', `${-10 + Math.random() * 20}px`);
  spark.style.setProperty('--spark-distance', `${45 + Math.random() * 75}px`);
  spark.style.setProperty('--spark-angle', `${-25 + Math.random() * 50}deg`);
  spark.style.animation = 'none';
  void spark.offsetWidth;
  spark.style.animation = 'sparkFall var(--spark-duration) ease-in 0s forwards';
}

function startSleighSparks() {
  if (!sleighSparks || sleighSparkTimer) return;
  for (let index = 0; index < 24; index += 1) emitSleighSpark();
  sleighSparkTimer = setInterval(emitSleighSpark, 55);
}

function stopSleighSparks() {
  clearInterval(sleighSparkTimer);
  sleighSparkTimer = null;
  if (sleighSparks) {
    [...sleighSparks.children].forEach((spark) => {
      spark.style.animation = 'none';
      spark.style.opacity = '0';
    });
  }
}

function chooseSantaSleighHeight() {
  const imageHeight = santaSleigh.getBoundingClientRect().height || 140;
  const margin = Math.min(imageHeight / 2 + 12, window.innerHeight * .1);
  sleighTargetY = margin + Math.random() * Math.max(1, window.innerHeight - margin * 2);
}

function animateSantaSleigh(timestamp) {
  if (!santaSleigh || !decemberMode) {
    sleighAnimationFrame = null;
    return;
  }
  const elapsed = Math.min(48, timestamp - (sleighLastFrame || timestamp));
  sleighLastFrame = timestamp;
  const imageWidth = santaSleigh.getBoundingClientRect().width || 220;
  sleighX += sleighDirection * elapsed * .11;
  if (sleighX > window.innerWidth + imageWidth / 2) sleighX = -imageWidth / 2;
  if (sleighX < -imageWidth / 2) sleighX = window.innerWidth + imageWidth / 2;
  sleighY += (sleighTargetY - sleighY) * Math.min(1, elapsed / 2600);
  if (Math.abs(sleighTargetY - sleighY) < 2) chooseSantaSleighHeight();
  santaSleigh.style.left = `${sleighX}px`;
  santaSleigh.style.top = `${sleighY}px`;
  santaSleigh.style.transform = `translate(-50%, -50%) scaleX(${sleighDirection})`;
  sleighAnimationFrame = requestAnimationFrame(animateSantaSleigh);
}

function startSantaSleigh() {
  if (!santaSleigh || !decemberMode) return;
  const imageWidth = santaSleigh.getBoundingClientRect().width || 220;
  const imageHeight = santaSleigh.getBoundingClientRect().height || 140;
  if (!sleighInitialized) {
    sleighX = -imageWidth / 2;
    sleighY = Math.max(imageHeight / 2, window.innerHeight * .3);
    chooseSantaSleighHeight();
    sleighInitialized = true;
  }
  santaSleigh.style.left = `${sleighX}px`;
  santaSleigh.style.top = `${sleighY}px`;
  santaSleigh.style.transform = `translate(-50%, -50%) scaleX(${sleighDirection})`;
  cancelAnimationFrame(sleighAnimationFrame);
  sleighLastFrame = 0;
  sleighAnimationFrame = requestAnimationFrame(animateSantaSleigh);
}

function setDecemberMode(enabled) {
  decemberMode = enabled;
  document.body.classList.toggle('december-mode', enabled);
  if (decemberToggle) decemberToggle.setAttribute('aria-pressed', String(enabled));
  if (enabled) {
    startSantaSleigh();
    startSleighSparks();
  } else {
    cancelAnimationFrame(sleighAnimationFrame);
    sleighAnimationFrame = null;
    stopSleighSparks();
  }
}

function updateDecemberMode() {
  setDecemberMode(modeActive ? isDecember(new Date()) : decemberMode);
}

function isWomenDay(date) {
  return date.getMonth() === 2 && date.getDate() === 8;
}

function setWomenDayMode(enabled) {
  womenDayMode = enabled;
  document.body.classList.toggle('women-day-mode', enabled);
}

function updateWomenDayMode() {
  setWomenDayMode(modeActive ? isWomenDay(new Date()) : womenDayMode);
}

function getPatriaEvent(date) {
  return PATRIA_EVENTS.find((event) => event.day === date.getDate() && event.month === date.getMonth()) || null;
}

function setPatriaMode(enabled, event = null) {
  patriaMode = enabled;
  document.body.classList.toggle('patria-mode', enabled);
  document.body.classList.toggle('september-twenty-first-mode', enabled && event?.label === '21 de septiembre');
  patriaEventToggles.forEach((button) => {
    button.setAttribute('aria-pressed', String(enabled && button.dataset.eventDate === (event ? event.label : undefined)));
  });
}

function updatePatriaBackground(event) {
  if (!event) {
    document.body.classList.remove('has-patria-background');
    document.body.classList.remove('october-twelfth-mode');
    document.body.classList.remove('september-twenty-first-mode');
    document.body.style.background = '';
    stopSeptemberButterflies();
    return;
  }
  const backgroundMap = {
    '8 de marzo': 'fechas_patrias/8%20de%20marzo%20-%20fondo.webp',
    '21 de septiembre': 'fechas_patrias/21%20e%20septiembre%20-%20fondo.jpeg',
    '25 de mayo': 'fechas_patrias/25%20de%20mayo%20-%20fondo.jpg',
    '17 de junio': 'fechas_patrias/17%20de%20junio%20-%20fondo.webp',
    '12 de octubre': 'fechas_patrias/12%20de%20octubre%20-%20fondo.jpg'
  };
  const backgroundUrl = backgroundMap[event.label] || 'fechas_patrias/fondo.webp';
  document.body.classList.add('has-patria-background');
  document.body.classList.toggle('october-twelfth-mode', event.label === '12 de octubre');
  document.body.classList.toggle('september-twenty-first-mode', event.label === '21 de septiembre');
  if (backgroundUrl) {
    const overlay = event.label === '8 de marzo'
      ? 'rgba(236,104,155,.28)'
      : event.label === '21 de septiembre'
        ? 'rgba(20,46,32,.22)'
        : 'rgba(4,28,24,.28)';
    document.body.style.background = `linear-gradient(${overlay}, ${overlay}), url('${backgroundUrl}') center / cover fixed no-repeat`;
  }
  if (event.label === '21 de septiembre') {
    startSeptemberButterflies();
  } else {
    stopSeptemberButterflies();
  }
}

function updatePatriaMode() {
  const event = getPatriaEvent(new Date());
  selectedPatriaEvent = event;
  setPatriaMode(Boolean(event), event);
  updatePatriaBackground(event);
  if (event && (event.label === '24 de marzo' || event.label === '2 de abril' || event.label === '8 de marzo' || event.label === '21 de septiembre' || event.label === '25 de mayo' || event.label === '17 de junio' || event.label === '12 de octubre')) {
    setPatriaAsset(event);
  }
}

function captionTextToHtml(title, text) {
  if (!text) return '';
  const paragraphs = text
    .split(/\n\s*\n/)
    .map((p) => p.replace(/\n+/g, ' ').trim())
    .filter(Boolean);

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (s) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[s]);
  }

  const titleHtml = title ? `<p class="alert-caption-title"><strong>${escapeHtml(title)}</strong></p>` : '';
  const bodyHtml = paragraphs.map((p) => `<p>${escapeHtml(p)}</p>`).join('');
  return `${titleHtml}<div class="alert-caption-body"><div class="alert-caption-scroll">${bodyHtml}</div></div>`;
}

function prepareCaptionScroll() {
  if (!alertCaption) return 0;
  const body = alertCaption.querySelector('.alert-caption-body');
  const scrollContent = alertCaption.querySelector('.alert-caption-scroll');
  if (!body || !scrollContent) return 0;

  const distance = Math.max(0, scrollContent.scrollHeight - body.clientHeight);
  const duration = Math.max(18, distance * 0.12);
  scrollContent.style.setProperty('--caption-scroll-distance', `${-distance}px`);
  scrollContent.style.setProperty('--caption-scroll-duration', `${duration}s`);
  
  // Forzar reinicio de la animación
  scrollContent.style.animation = 'none';
  scrollContent.offsetHeight; // Forzar reflow
  scrollContent.style.animation = `captionScroll ${duration}s ease-in-out 1 forwards`;
  
  scrollContent.style.animationPlayState = distance > 0 ? 'running' : 'paused';
  return distance > 0 ? duration * 1000 : 0;
}

function scheduleCaptionScroll(onReady) {
  const notifyReady = () => {
    const scrollDuration = prepareCaptionScroll();
    if (onReady) onReady(scrollDuration);
  };
  requestAnimationFrame(() => {
    notifyReady();
    requestAnimationFrame(notifyReady);
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(notifyReady);
  setTimeout(notifyReady, 800);
}

function shuffleAssets(assets) {
  const shuffledAssets = [...assets];
  for (let index = shuffledAssets.length - 1; index > 0; index -= 1) {
    const randomIndex = Math.floor(Math.random() * (index + 1));
    [shuffledAssets[index], shuffledAssets[randomIndex]] = [shuffledAssets[randomIndex], shuffledAssets[index]];
  }
  return shuffledAssets;
}

async function loadModeAssetManifest() {
  try {
    const response = await fetch(`${MODE_MANIFEST_PATH}?t=${Date.now()}`, { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    const manifestAssets = Array.isArray(data)
      ? data.map((entry) => (typeof entry === 'string' ? entry : entry.image)).filter(Boolean)
      : [];

    if (!manifestAssets.length) throw new Error('El manifiesto no contiene imágenes');
    modeAssets = shuffleAssets(manifestAssets);
  } catch (error) {
    modeAssets = [];
    console.warn('No se pudo cargar extra/manifest.json:', error);
  }
}

async function loadCaptionFor(imageFileName) {
  const base = imageFileName.replace(/\.[^./]+$/, '');
  try {
    const response = await fetch(`${MODE_IMAGE_DIR}${encodeURIComponent(base)}.txt`, { cache: 'no-cache' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return (await response.text()).trim();
  } catch (error) {
    console.warn(`No se encontró texto para "${imageFileName}", se usa el nombre de archivo.`, error);
    return base;
  }
}

async function setPatriaAsset(event) {
  if (event && event.label === '8 de marzo') {
    await loadWomenDayManifest();
    startWomenDayImageRotation();
    return;
  }
  const imageExtensions = {
    '24 de marzo': 'webp',
    '2 de abril': 'jpg',
    '21 de septiembre': 'webp',
    '25 de mayo': 'jpg',
    '17 de junio': 'jpg',
    '12 de octubre': 'jpeg'
  };
  const imageExtension = imageExtensions[event ? event.label : undefined];
  if (!alertImage || !imageExtension) return;
  const baseName = encodeURIComponent(event.label);
  const imageUrl = `fechas_patrias/${baseName}.${imageExtension}`;
  let caption = '';
  try {
    const response = await fetch(`fechas_patrias/${baseName}.txt`, { cache: 'no-cache' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    caption = (await response.text()).trim();
  } catch (error) {
    console.warn(`No se pudo cargar el texto de fechas_patrias/${event.label}.txt`, error);
  }
  const nextImage = new Image();
  nextImage.onload = () => {
    alertImage.style.opacity = '0';
    setTimeout(() => {
      if (!patriaMode || !selectedPatriaEvent || selectedPatriaEvent.label !== event.label) return;
      alertImage.src = imageUrl;
      if (alertCaption) {
        alertCaption.innerHTML = captionTextToHtml(event.label, caption);
        scheduleCaptionScroll();
      }
      alertImage.style.opacity = '1';
    }, 600);
  };
  nextImage.onerror = () => {
    console.warn(`No se pudo cargar la imagen ${imageUrl}.`);
  };
  nextImage.src = imageUrl;
}

async function loadWomenDayManifest() {
  try {
    const response = await fetch(`${WOMEN_DAY_MANIFEST_PATH}?t=${Date.now()}`, { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    const manifestAssets = Array.isArray(data)
      ? data.map((entry) => (typeof entry === 'string' ? entry : entry.image)).filter(Boolean)
      : [];
    if (!manifestAssets.length) throw new Error('El manifiesto no contiene imágenes');
    womenDayAssets = shuffleAssets(manifestAssets);
  } catch (error) {
    womenDayAssets = [];
    console.warn('No se pudo cargar fechas_patrias/8 de marzo/manifest.json:', error);
  }
}

async function setWomenDayAsset(imageFileName) {
  if (!alertImage) return;
  const imageUrl = `${WOMEN_DAY_DIR}${encodeURIComponent(imageFileName)}`;
  const baseName = imageFileName.replace(/\.[^./]+$/, '');
  let caption = '';
  try {
    const response = await fetch(`${WOMEN_DAY_DIR}${encodeURIComponent(baseName)}.txt`, { cache: 'no-cache' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    caption = (await response.text()).trim();
  } catch (error) {
    console.warn(`No se encontró texto para "${imageFileName}" en fechas_patrias/8 de marzo/.`, error);
    caption = baseName;
  }
  const nextImage = new Image();
  nextImage.onload = () => {
    alertImage.style.opacity = '0';
    setTimeout(() => {
      if (!patriaMode || !selectedPatriaEvent || selectedPatriaEvent.label !== '8 de marzo') return;
      alertImage.src = imageUrl;
      if (alertCaption) {
        alertCaption.innerHTML = captionTextToHtml(baseName, caption);
        scheduleCaptionScroll((scrollDuration) => scheduleWomenDayImageRotation(scrollDuration));
      }
      alertImage.style.opacity = '1';
    }, 600);
  };
  nextImage.onerror = () => console.warn(`No se pudo cargar la imagen ${imageUrl}.`);
  nextImage.src = imageUrl;
}

function rotateWomenDayImage() {
  if (!patriaMode || selectedPatriaEvent?.label !== '8 de marzo' || womenDayAssets.length === 0) return;
  womenDayImageIndex = (womenDayImageIndex + 1) % womenDayAssets.length;
  setWomenDayAsset(womenDayAssets[womenDayImageIndex]);
}

function scheduleWomenDayImageRotation(scrollDuration = 0) {
  clearTimeout(womenDayImageTimer);
  if (!patriaMode || selectedPatriaEvent?.label !== '8 de marzo' || womenDayAssets.length <= 1) return;
  womenDayImageTimer = setTimeout(rotateWomenDayImage, scrollDuration + MODE_IMAGE_PAUSE);
}

function startWomenDayImageRotation() {
  clearTimeout(womenDayImageTimer);
  if (!patriaMode || selectedPatriaEvent?.label !== '8 de marzo' || womenDayAssets.length === 0) return;
  womenDayImageIndex = 0;
  setWomenDayAsset(womenDayAssets[womenDayImageIndex]);
}

async function setAlertAsset(imageFileName) {
  if (!alertImage) return;
  const caption = await loadCaptionFor(imageFileName);
  const title = imageFileName.replace(/\.[^./]+$/, '');
  const imageUrl = `${MODE_IMAGE_DIR}${encodeURIComponent(imageFileName)}`;
  const nextImage = new Image();
  nextImage.onload = () => {
    alertImage.style.opacity = '0';
    setTimeout(() => {
      if (!modeActive) return;
      alertImage.src = imageUrl;
      if (alertCaption) {
        alertCaption.innerHTML = captionTextToHtml(title, caption);
        scheduleCaptionScroll((scrollDuration) => {
          scheduleModeImageRotation(scrollDuration);
        });
      }
      alertImage.style.opacity = '1';
    }, 600);
  };
  nextImage.onerror = () => {
    console.warn(`No se pudo cargar la imagen "${imageFileName}".`);
  };
  nextImage.src = imageUrl;
}

function rotateModeImage() {
  if (!modeActive || modeAssets.length === 0) return;
  modeImageIndex = (modeImageIndex + 1) % modeAssets.length;
  setAlertAsset(modeAssets[modeImageIndex]);
}

function scheduleModeImageRotation(scrollDuration) {
  clearTimeout(modeImageTimer);
  if (!modeActive || modeAssets.length <= 1) return;
  modeImageTimer = setTimeout(rotateModeImage, scrollDuration + MODE_IMAGE_PAUSE);
}

function startModeImageRotation() {
  if (!alertImage || modeAssets.length === 0) return;
  modeImageIndex = 0;
  setAlertAsset(modeAssets[modeImageIndex]);
}

function stopModeImageRotation() {
  clearTimeout(modeImageTimer);
  modeImageTimer = null;
  if (!alertImage) return;
  alertImage.style.opacity = '0';
  setTimeout(() => {
    alertImage.src = 'enfermera.png';
    if (alertCaption) alertCaption.innerHTML = '';
    alertImage.style.opacity = '1';
  }, 600);
}

function updateSoundPlayback(alertActive) {
  const shouldPlay = soundEnabled && alertActive;
  if (shouldPlay) {
    updateSoundIndicator(true, 'waiting');
    silenceAudio.play().catch((error) => {
      soundEnabled = false;
      soundToggle.setAttribute('aria-pressed', 'false');
      soundToggle.setAttribute('aria-label', 'Activar sonido');
      soundToggle.setAttribute('title', `Error de audio: ${error.name}`);
      updateSoundIndicator(true, 'error');
    });
    return;
  }
  silenceAudio.pause();
  silenceAudio.currentTime = 0;
  updateSoundIndicator(false, 'idle');
}

function setSoundEnabled(enabled) {
  soundEnabled = enabled;
  soundToggle.setAttribute('aria-pressed', String(enabled));
  soundToggle.setAttribute('aria-label', enabled ? 'Desactivar sonido' : 'Activar sonido');
  soundToggle.setAttribute('title', enabled ? 'Desactivar sonido' : 'Activar sonido');
}

function updateSoundIndicator(alertActive, status) {
  const isPlaying = status === 'playing';
  const isError = alertActive && status !== 'playing';
  soundToggle.classList.toggle('playing', isPlaying);
  soundToggle.classList.toggle('sound-error', isError);
}

silenceAudio.addEventListener('playing', () => {
  updateSoundIndicator(true, 'playing');
});

['pause', 'ended', 'error'].forEach((eventName) => {
  silenceAudio.addEventListener(eventName, () => {
    updateSoundIndicator(alertWrapper.style.display !== 'none', eventName === 'error' ? 'error' : 'idle');
  });
});

silenceAudio.addEventListener('error', () => {
  const mediaError = silenceAudio.error;
  const errorCode = mediaError ? ` (${mediaError.code})` : '';
  soundToggle.setAttribute('title', `No se pudo cargar sonido_hospital.mp3${errorCode}`);
});

soundToggle.addEventListener('click', () => {
  setSoundEnabled(!soundEnabled);
  updateSoundPlayback(alertWrapper.style.display !== 'none');
});

modeToggle.addEventListener('click', async () => {
  modeActive = !modeActive;
  alertWrapper.classList.toggle('mode-active', modeActive);
  document.body.classList.toggle('developer-mode', !modeActive);
  developerModeIndicator.classList.toggle('visible', !modeActive);
  modeToggle.setAttribute('aria-pressed', String(modeActive));
  const nextModeLabel = modeActive ? 'Cambiar al modo desarrollador' : 'Volver al modo pantalla';
  modeToggle.setAttribute('aria-label', nextModeLabel);
  modeToggle.setAttribute('title', nextModeLabel);
  if (modeActive) {
    updateDecemberMode();
    updateWomenDayMode();
    updatePatriaMode();
    await loadModeAssetManifest();
    startModeImageRotation();
  } else {
    setDecemberMode(decemberMode);
    setWomenDayMode(womenDayMode);
    selectedPatriaEvent = null;
    setPatriaMode(false);
    updatePatriaBackground(null);
    stopModeImageRotation();
  }
});

decemberToggle.addEventListener('click', () => {
  if (!modeActive) setDecemberMode(!decemberMode);
});

patriaEventToggles.forEach((button) => {
  button.addEventListener('click', () => {
    if (modeActive) return;
    const event = PATRIA_EVENTS.find((item) => item.label === button.dataset.eventDate);
    if (!event) return;
    selectedPatriaEvent = patriaMode && selectedPatriaEvent && selectedPatriaEvent.label === event.label ? null : event;
    setPatriaMode(Boolean(selectedPatriaEvent), selectedPatriaEvent);
    if (selectedPatriaEvent && selectedPatriaEvent.label === '8 de marzo') {
      setWomenDayMode(true);
    } else {
      setWomenDayMode(false);
    }
    clearTimeout(womenDayImageTimer);
    updatePatriaBackground(selectedPatriaEvent);
    if (selectedPatriaEvent && (selectedPatriaEvent.label === '24 de marzo' || selectedPatriaEvent.label === '2 de abril' || selectedPatriaEvent.label === '8 de marzo' || selectedPatriaEvent.label === '21 de septiembre' || selectedPatriaEvent.label === '25 de mayo' || selectedPatriaEvent.label === '17 de junio' || selectedPatriaEvent.label === '12 de octubre')) {
      setPatriaAsset(selectedPatriaEvent);
    } else if (!selectedPatriaEvent) {
      setWomenDayMode(false);
    }
  });
});

loadModeAssetManifest().then(startModeImageRotation);
createSnowflakes();
createSleighSparks();
updateDecemberMode();
updateWomenDayMode();
updatePatriaMode();
window.addEventListener('resize', () => {
  if (decemberMode) chooseSantaSleighHeight();
  scheduleCaptionScroll();
});
setInterval(() => {
  if (modeActive) {
    updateDecemberMode();
    updateWomenDayMode();
    updatePatriaMode();
  }
}, 60000);

let inactivityTimer;
const resetCursorTimer = () => {
  document.body.classList.remove('cursor-hidden');
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => {
    document.body.classList.add('cursor-hidden');
  }, 10000);
};

['mousemove', 'keydown', 'touchstart', 'click'].forEach((eventName) => {
  document.addEventListener(eventName, resetCursorTimer, { passive: true });
});

resetCursorTimer();

function dotSVG() {
  return '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="currentColor"/></svg>';
}

function stateLabel(room) {
  if (room.state === 'debrief') return 'Debriefing en curso';
  if (room.state === 'ocupada') return 'En simulación';
  return 'Libre';
}

function stateGradient(state) {
  if (state === 'debrief') return { g1: 'var(--debrief-1)', g2: 'var(--debrief-2)' };
  if (state === 'ocupada') return { g1: 'var(--ocupada-1)', g2: 'var(--ocupada-2)' };
  return { g1: 'var(--libre-1)', g2: 'var(--libre-2)' };
}

function eyebrowLabel(room) {
  return room.type === 'debrief' ? 'Debriefing' : 'Área clínica';
}

function roomDisplayName(name) {
  const normalized = (name || '').toString().trim().toLowerCase();
  if (['sala de debriefing 1', 'sala 1', '1', 'debriefing 1', 'debriefing a'].includes(normalized)) return 'Sala de Debriefing A';
  if (['sala de debriefing 2', 'sala 2', '2', 'debriefing 2', 'debriefing b'].includes(normalized)) return 'Sala de Debriefing B';
  return name;
}

function getRoomByName(name) {
  const key = roomDisplayName(name);
  return roomsData.find((room) => roomDisplayName(room.name) === key);
}

function toggleRoomState(name) {
  const room = getRoomByName(name);
  if (!room) return;

  if (room.type === 'debrief') {
    room.state = room.state === 'libre' ? 'debrief' : 'libre';
  } else {
    room.state = room.state === 'libre' ? 'ocupada' : 'libre';
  }

  render();
}

function moveRoomFocus(card, key) {
  const cards = [...grid.querySelectorAll('.card')];
  const currentIndex = cards.indexOf(card);
  if (currentIndex < 0) return;

  const columns = Math.max(1, getComputedStyle(grid).gridTemplateColumns.split(' ').length);
  let nextIndex = currentIndex;

  if (key === 'ArrowLeft') nextIndex = currentIndex > 0 ? currentIndex - 1 : cards.length - 1;
  if (key === 'ArrowRight') nextIndex = currentIndex < cards.length - 1 ? currentIndex + 1 : 0;
  if (key === 'ArrowUp') nextIndex = currentIndex >= columns ? currentIndex - columns : currentIndex;
  if (key === 'ArrowDown') nextIndex = currentIndex + columns < cards.length ? currentIndex + columns : currentIndex;

  if (nextIndex !== currentIndex) {
    cards[nextIndex].focus();
  }
}

function render() {
  const activeCard = document.activeElement && document.activeElement.closest('.card');
  const focusedRoomName = activeCard ? activeCard.dataset.roomName : undefined;
  grid.innerHTML = '';
  let anyBusy = false;

  const rooms = [...roomsData].sort((a, b) => {
    const aName = roomDisplayName(a.name);
    const bName = roomDisplayName(b.name);
    return ROOM_ORDER.indexOf(aName) - ROOM_ORDER.indexOf(bName);
  });

  rooms.forEach((room, index) => {
    const roomState = room.state;
    if (BUSY_STATES.has(roomState)) anyBusy = true;

    const { g1, g2 } = stateGradient(roomState);
    const code = String(index + 1).padStart(2, '0');

    const card = document.createElement('div');
    card.className = `card${roomState === 'libre' ? ' free-card' : ''}`;
    card.style.setProperty('--grad-1', g1);
    card.style.setProperty('--grad-2', g2);
    card.setAttribute('tabindex', '0');
    card.setAttribute('role', 'button');
    card.dataset.roomName = roomDisplayName(room.name);
    card.setAttribute('aria-pressed', String(roomState !== 'libre'));
    card.addEventListener('click', () => toggleRoomState(room.name));
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleRoomState(room.name);
        return;
      }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        document.body.classList.add('keyboard-navigation');
        moveRoomFocus(card, e.key);
      }
    });

    card.innerHTML = `
      <div class="card-sheen"></div>
      <div class="card-snow-cap" aria-hidden="true"></div>
      <div class="card-top">
        <span class="eyebrow"><span class="code">${code}</span> ${eyebrowLabel(room)}</span>
        <span class="led ${roomState !== 'libre' ? 'pulse' : ''}"></span>
      </div>
      <h2 class="name ${BUSY_STATES.has(roomState) ? 'beat' : ''}">${roomDisplayName(room.name)}</h2>
      <div class="foot"><span class="pill">${dotSVG()} ${stateLabel(room)}</span></div>`;
    grid.appendChild(card);
  });

  alertWrapper.style.display = anyBusy ? 'flex' : 'none';
  if (anyBusy && !alertWasActive) setSoundEnabled(true);
  alertWasActive = anyBusy;
  updateSoundPlayback(anyBusy);

  const nextFocusedCard = [...grid.querySelectorAll('.card')].find((card) => card.dataset.roomName === focusedRoomName);
  const initialCard = nextFocusedCard || grid.querySelector('.card');
  if (initialCard) {
    initialCard.focus();
  }
}

function updateDateTime() {
  const now = new Date();
  timeText.textContent = now.toLocaleTimeString('es-ES');
  dateText.textContent = now.toLocaleDateString('es-ES', {
    weekday: 'long',
    day: '2-digit',
    month: '2-digit',
    year: 'numeric'
  });
}

render();
updateDateTime();
setInterval(updateDateTime, 1000);
</script>
