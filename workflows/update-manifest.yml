name: Actualizar manifest.json de extra/

on:
  schedule:
    # Corre todos los días a las 06:00 UTC (~03:00 en Argentina)
    - cron: '0 6 * * *'
  push:
    paths:
      - 'extra/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar manifest.json
        run: node scripts/generate-manifest.js

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extra/manifest.json
          git diff --cached --quiet || git commit -m "chore: actualizar manifest.json automáticamente"
          git push
